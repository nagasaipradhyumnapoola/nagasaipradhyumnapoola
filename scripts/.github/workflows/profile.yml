name: refresh profile

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install requests

      - name: generate recent heatmap
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/heatmap.py

      - name: commit generated heatmap
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"

          git add assets/recent-weeks.svg

          if git diff --cached --quiet; then
            echo "No heatmap changes."
            exit 0
          fi

          git commit -m "chore: refresh activity"
          git push
